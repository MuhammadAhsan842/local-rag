# -------------------------------------------------------------------------
# jobhunt-agent config. Edit sources + filters to your target.
# -------------------------------------------------------------------------

resume_file: "resume.pdf"        # used by apply-assist to attach your resume
tailor_top_n: 5                  # generate tailored bullets for the top N matches

model:
  chat: "qwen3.5:2b"            # best chat model that finishes on this CPU
  embed: "nomic-embed-text:latest"

# Weighted hybrid fit score (Resume-Matcher pattern). Components are 0-100:
#   vector  = semantic similarity (embeddings)
#   llm     = local model's blunt fit judgment
#   keyword = must/nice skill overlap
# If a component is unavailable (e.g. Ollama down), its weight is redistributed.
scoring:
  weights:
    vector: 0.3
    llm: 0.6
    keyword: 0.1
  use_history: true               # let the learned per-source reply-rate nudge ranking

# Batch auto-apply (the safe high-throughput lane). Auto-submits ONLY on company
# ATS pages (Greenhouse/Lever/Ashby/Workable) — never on LinkedIn/aggregators.
#   python run.py --auto-apply            # dry-run plan
#   python run.py --auto-apply --go       # actually submit on ATS
autopilot:
  min_fit: 70                     # only apply to roles scoring >= this
  min_faithfulness: 1.0           # never submit a CV with an unverified bullet
  max_applies: 15                 # hard cap per run (raise as you gain confidence)
  pace_seconds: 20                # polite delay between submissions

sources:
  # Company ATS boards — keyless, direct from employer. Add companies you'd target.
  # The slug is what's in the careers URL, e.g. boards.greenhouse.io/<slug>.
  # Public application forms (Greenhouse / Lever / Ashby). Each slug was checked
  # and returned live jobs. US-located postings are still dropped by the Europe filter.
  greenhouse: ["stabilityai", "wayve", "doctolib", "adyen", "n26", "contentful", "elastic", "gitlab", "canonical", "mozilla", "algolia", "mirakl", "trustpilot", "hellofresh", "wolt", "wise", "monzo", "gocardless", "sumup", "shifttechnology", "celonis", "typeform", "getyourguide", "trivago"]
  lever: ["spotify", "qonto", "airalo"]
  ashby: ["constructor", "stream", "n8n", "photoroom", "elevenlabs", "owkin", "parloa", "triggerdev", "ashby", "clera", "viktor", "alephalpha", "synthesia", "alan", "pennylane", "pleo", "mollie", "resend"]

  remotive:
    enabled: true
    category: "software-dev"
    search: "AI engineer"        # server-side filter is flaky; we also filter locally

  # Arbeitnow — keyless, ATS-sourced, native remote + visa flags. Great for a
  # remote-first hunt. Paginated internally (we loop safely until the last page).
  # Public job boards. names=null fetches every board in jobhunt/boards.py.
  # These add listings to the radar. They do not auto-submit applications.
  boards:
    enabled: true
    names:

  # Mercor expert network. Listings are public. Applying stops at sign-in;
  # the AI interview and work-authorization step stay with the person.
  mercor:
    enabled: true
    max_details: 8

  arbeitnow:
    enabled: true
    remote_only: true            # only keep postings the API flags as remote
    visa_only: false             # set true to keep only visa-sponsoring roles
    max_pages: 5

  # Read job-alert emails (LinkedIn/Indeed/Otta/Wellfound...) over READ-ONLY IMAP.
  # Gmail: create an App Password, then `export JOBHUNT_EMAIL_PASS=your_app_pw`.
  # The password is NEVER stored here — only the env-var name is.
  email:
    enabled: false               # set true once user + app password are ready
    host: "imap.gmail.com"
    port: 993
    user: "rosheelbaig@gmail.com"
    password_env: "JOBHUNT_EMAIL_PASS"
    folder: "INBOX"
    since_days: 7
    max_emails: 100
    senders:                     # only parse alerts from these; [] = all recent mail
      - "jobalerts-noreply@linkedin.com"
      - "jobs-listings@linkedin.com"
      - "invitations@indeed.com"
      - "alert@indeed.com"
      - "no-reply@otta.com"
      - "team@hi.wellfound.com"

  # RemoteOK — keyless JSON API, global remote roles.
  remoteok:
    enabled: true
    search: "AI"                 # local keyword filter; "" = all

  # Hacker News "Who is Hiring" monthly thread (keyless Algolia API).
  hackernews:
    enabled: true
    remote_only: true
    keywords: ["ai", "ml", "machine learning", "llm"]

  # Generic RSS feeds — add any board that publishes one (auto-ingested).
  rss:
    enabled: true
    feeds:
      - {name: "jobspresso", url: "https://jobspresso.co/?feed=job_feed"}
      - {name: "weworkremotely", url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"}
      - {name: "ai-jobs.net", url: "https://ai-jobs.net/feed/"}
      # add more: Remote.co, Working Nomads, Himalayas, NoDesk (RSS URLs)

  # Optional. Free key: https://developer.adzuna.com  (leave blank to skip)
  adzuna:
    app_id: ""
    app_key: ""
    what: "AI engineer"
    where: ""                    # e.g. "London", "remote"
    country: "gb"                # gb, us, in, au, ... (see Adzuna docs)

filters:
  title_must_include_any: ["ai", "ml", "machine learning", "llm", "applied scientist", "engineer"]
  exclude_any: ["intern", "unpaid", "sales", "recruiter"]
  skills_must: ["python"]
  skills_nice: ["pytorch", "llm", "rag", "transformers", "docker"]

  # --- remote-first, urgent-hunt tuning -----------------------------------
  remote_only: true      # keep only roles detected as remote (set false to widen)
  region: europe         # drop US-located roles; keep Europe, UK, or worldwide
  max_age_days: 30       # drop postings older than this (null = keep all)
  recency_boost: 8       # +points for fresh posts so new roles surface first

  # Hard eligibility — applied BEFORE ranking, so you never rank roles you
  # can't take. Seniority ladder: intern 0, junior 1, mid 2, senior 3, lead 4,
  # principal/staff 5, head/director 6, vp 7, chief 8.
  eligibility:
    min_seniority: 1     # drop internships (set 2 to also drop junior)
    max_seniority: 5     # drop director+ roles
    require_visa_sponsorship: false   # true => drop roles that won't sponsor
    exclude_clearance: true            # drop roles needing security clearance
    allowed_locations: []              # e.g. ["Germany","Berlin","EU"]; remote always passes

# Vocabulary used for deterministic skill extraction + gap analysis.
skill_vocab:
  - python
  - pytorch
  - tensorflow
  - llm
  - rag
  - langchain
  - transformers
  - hugging face
  - fine-tuning
  - embeddings
  - vector database
  - fastapi
  - docker
  - kubernetes
  - aws
  - gcp
  - mlops
  - nlp
  - computer vision
  - sql
  - distributed training
  - cuda
  - prompt engineering
  - agents
